<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="350" viewBox="0 0 1200 350" role="img" aria-labelledby="title desc">
<title id="title">Wael Demeri — Software Engineer</title>
<desc id="desc">Thoughtful interfaces. Solid engineering. Web and mobile, backend APIs, cloud and delivery. Based in Jordan.</desc>
